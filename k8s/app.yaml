apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-app
  template:
    metadata:
      labels:
        app: quiz-app
    spec:
      containers:
        - name: quiz-app
          image: online-quiz-python-main-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://quiz:quizpass@quiz-db:5432/quizdb"
            - name: REDIS_URL
              value: "redis://quiz-redis:6379/0"
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-app
spec:
  selector:
    app: quiz-app
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort
