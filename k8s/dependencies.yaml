apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-db
  template:
    metadata:
      labels:
        app: quiz-db
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: quizdb
            - name: POSTGRES_USER
              value: quiz
            - name: POSTGRES_PASSWORD
              value: quizpass
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-db
spec:
  selector:
    app: quiz-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-redis
  template:
    metadata:
      labels:
        app: quiz-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.1-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-redis
spec:
  selector:
    app: quiz-redis
  ports:
    - port: 6379
      targetPort: 6379
