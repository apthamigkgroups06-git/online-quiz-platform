version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12.11
    working_directory: ~/project/online-quiz-python-main
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt ruff
      - run:
          name: Lint Python code
          command: ruff check app

  unit-tests:
    docker:
      - image: cimg/python:3.12.11
    working_directory: ~/project/online-quiz-python-main
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install test dependencies
          command: |
            pip install -r requirements.txt pytest pytest-cov
      - run:
          name: Run unit tests
          command: |
            pytest tests/test_scoring.py \
              --cov=app.scoring \
              --cov-report=term-missing

  integration-tests:
    docker:
      - image: cimg/python:3.12.11
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_DB: quizdb
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quizpass
      - image: cimg/redis:7.4.1
    working_directory: ~/project/online-quiz-python-main
    environment:
      DATABASE_URL: postgresql://quiz:quizpass@localhost:5432/quizdb
      REDIS_URL: redis://localhost:6379/0
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: |
            pip install -r requirements.txt pytest pytest-cov
      - run:
          name: Wait for PostgreSQL and Redis
          command: |
            python - <<'PY'
            import os
            import time
            import psycopg
            import redis

            for attempt in range(30):
                try:
                    with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
                        conn.execute("SELECT 1")
                    redis.Redis.from_url(
                        os.environ["REDIS_URL"]
                    ).ping()
                    print("PostgreSQL and Redis are ready.")
                    break
                except Exception:
                    if attempt == 29:
                        raise
                    time.sleep(2)
            PY
      - run:
          name: Apply database migrations
          command: |
            for file in migrations/*.sql; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
            done
      - run:
          name: Run integration tests
          command: pytest tests/test_integration.py

  secret-scan:
    docker:
      - image: cimg/base:current
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Scan repository for secrets
          command: |
            docker run --rm \
              -v "$PWD:/repo:ro" \
              zricethezav/gitleaks:latest \
              detect --source=/repo --no-git --redact

  docker-build:
    docker:
      - image: cimg/base:current
    working_directory: ~/project
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build \
              -t apthami5671/online-quiz-platform:1.0 \
              ./online-quiz-python-main

workflows:
  quiz-platform-pipeline:
    jobs:
      - lint
      - unit-tests:
          requires:
            - lint
      - integration-tests:
          requires:
            - unit-tests
      - secret-scan:
          requires:
            - integration-tests
      - docker-build:
          requires:
            - secret-scan