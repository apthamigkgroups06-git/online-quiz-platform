version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt ruff pytest
      - run:
          name: Lint Python code
          command: ruff check app tests

  tests:
    docker:
      - image: cimg/python:3.12.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt pytest
      - run:
          name: Run automated tests
          command: pytest -q

  docker-build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build application Docker image
          command: docker build -t online-quiz-platform:ci .

workflows:
  quiz-platform-pipeline:
    jobs:
      - lint
      - tests
      - docker-build
