version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            cd online-quiz-python-main
            pip install -r requirements.txt
            pip install ruff

      - run:
          name: Run Ruff lint
          command: |
            cd online-quiz-python-main
            ruff check app tests

  tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            cd online-quiz-python-main
            pip install -r requirements.txt
            pip install pytest

      - run:
          name: Run automated tests
          command: |
            cd online-quiz-python-main
            pytest --import-mode=importlib tests -q

  docker-build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: |
            docker build \
              -t online-quiz-platform:ci \
              ./online-quiz-python-main

workflows:
  build-and-test:
    jobs:
      - lint
      - tests
      - docker-build